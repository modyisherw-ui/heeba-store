<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>هيبة | نتيجة الدفع</title><link rel="stylesheet" href="assets/css/style.css"></head>
<body class="payment-result-page"><main class="result-card"><img src="assets/logo.svg" class="result-logo" alt="هيبة"><span class="eyebrow">PAYMENT RESULT</span><h1 id="resultTitle">جاري التحقق من الدفع</h1><p id="resultText">نراجع حالة العملية مع بوابة الدفع بشكل آمن قبل اعتماد الطلب.</p><div id="resultSpinner" class="result-spinner"></div><a id="resultLink" class="primary-btn" href="index.html#home" hidden>العودة للرئيسية</a></main><script>const q=new URLSearchParams(location.search);const orderId=q.get('orderId')||sessionStorage.getItem('heeba_payment_order');const paymentId=q.get('id')||sessionStorage.getItem('heeba_last_payment_id');const title=document.getElementById('resultTitle'),text=document.getElementById('resultText'),spin=document.getElementById('resultSpinner'),link=document.getElementById('resultLink');(async()=>{try{if(!orderId||!paymentId)throw new Error('MISSING');const r=await fetch('/api/payment/verify',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({orderId,paymentId})});const data=await r.json().catch(()=>({}));if(!r.ok||!data.ok)throw new Error(data.error||'FAILED');title.textContent='تم الدفع بنجاح';text.textContent='تم التحقق من العملية واعتماد الطلب. رقم الطلب: '+orderId;spin.remove();link.hidden=false;sessionStorage.removeItem('heeba_last_payment_id');sessionStorage.removeItem('heeba_payment_order');sessionStorage.removeItem('heeba_checkout')}catch(e){title.textContent='تعذر اعتماد الدفع';text.textContent='لم نتمكن من التحقق من العملية. لا تعتبر العملية ناجحة حتى تظهر حالة الدفع مؤكدة في المتجر.';spin.remove();link.hidden=false}})();</script></body></html>
